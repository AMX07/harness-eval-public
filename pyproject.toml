[project]
name = "harness-eval"
version = "0.1.0"
description = "Modular harness evaluations on Terminal-Bench with Harbor, Docker and Langfuse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "harbor==0.25.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
hx = "harness_eval.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
