# DeepSeek Harness + Claude Haiku 4.5: same tasks, attempts, turn cap and effort as tb2-cc-haiku45,
# so `hx compare` isolates the harness.
name: tb2-dsh-haiku45
description: DeepSeek Harness (sdk-minimal profile) + Haiku 4.5
dataset: terminal-bench@2.0
tasks:
  taskset: tb2-n30-seed2026
attempts: 3
concurrency: 4
timeout_multiplier: 1.0
harness:
  agent: harness_eval.agents.deepseek_harness:DeepSeekHarness
  label: DeepSeek Harness
  model: anthropic/claude-haiku-4-5
  kwargs:
    profile: sdk-minimal        # dsh's documented benchmark profile (BENCHMARK.md)
    sdk_version: "0.2.1rc2"
    max_turns: 100              # counted as model responses
    reasoning_effort: high      # dsh sends a 16,384-token thinking budget to Haiku 4.5 at "high"
secrets: [ANTHROPIC_API_KEY]
